services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      FRAUD_DB: /state/live.db
    volumes: ["fraud-state:/state"]
  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address=0.0.0.0
    ports: ["127.0.0.1:8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
volumes:
  fraud-state:
